  #       - AttributeName: ticker
  #         AttributeType: S
  #       - AttributeName: timestamp
  #         AttributeType: N
  #     KeySchema:
  #       - AttributeName: ticker
  #         KeyType: HASH
  #       - AttributeName: timestamp
  #         KeyType: RANGE
  #     StreamSpecification:
  #       StreamViewType: NEW_AND_OLD_IMAGES
  #     TimeToLiveSpecification:
  #       AttributeName: ttl
  #       Enabled: true
  #     Tags:
  #       - Key: Environment
  #         Value: !Ref Environment
  #       - Key: Project
  #         Value: StockAnalyticsPipeline

