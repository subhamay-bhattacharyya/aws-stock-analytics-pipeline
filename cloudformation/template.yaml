AWSTemplateFormatVersion: '2010-09-09'
Description: 'Real-time Stock Market Analytics Pipeline - Complete Stack with CloudFormation'

Parameters:
  ProjectName:
    Type: String
    Default: stock-analytics
    Description: Name of the application
  Environment:
    Type: String
    Default: devl
    AllowedValues: [devl, test, prod]
    Description: Environment name

  # StockDataStreamName:
  #   Type: String
  #   Default: stock-data-stream
  #   Description: Name of the Kinesis Data Stream

  # StockDataTableName:
  #   Type: String
  #   Default: processed-stock-data
  #   Description: Name of the DynamoDB table

  RawStockDataBucketBaseName:
    Type: String
    Description: Name of the S3 bucket for raw stock data (must be globally unique)

Resources:
  # ============================================================================
  # S3 Bucket for Raw Stock Data
  # ============================================================================
  RawStockDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${RawStockDataBucketBaseName}-${AWS::AccountId}-${AWS::Region}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ProjectName
          Value: !Ref ProjectName

  # ============================================================================
  # DynamoDB Table for Processed Stock Data
  # ============================================================================
